spring.application.name=gamerboxd

# Render terminates TLS, so trust its proxy headers to mark auth cookies Secure
server.forward-headers-strategy=native

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# Store/compare all timestamps in UTC to avoid JVM/DB timezone mismatches
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true

app.base-url=${APP_BASE_URL}
steam.api_key=${STEAM_API_KEY}