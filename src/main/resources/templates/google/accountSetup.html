<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Choose a username')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container auth-wrap">
        <h1 class="mb-1">Choose a username</h1>
        <p class="text-muted mb-4">You're signing up with Google as <span class="fw-semibold" th:text="${email}"></span>.</p>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/auth/google/finish}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" th:value="${username}"
                    minlength="3" maxlength="30" pattern="[A-Za-z0-9_\-]{3,30}" autocomplete="username"
                    aria-describedby="usernameHelp" required autofocus>
                <div class="form-text" id="usernameHelp">3-30 letters, numbers, underscores, or hyphens.</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Create account</button>
        </form>
    </main>
    <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>

</html>
