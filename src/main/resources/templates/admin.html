<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5" style="max-width: 1100px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center gap-3">
                <h1 class="mb-0">Admin Panel</h1>
                <a th:href="@{/}" class="btn btn-outline-secondary btn-sm mt-2">back</a>
            </div>
            <span class="text-muted" th:text="|${#lists.size(users)} users|"></span>
        </div>

        <p class="text-muted" th:if="${#lists.isEmpty(users)}">No users found.</p>

        <div class="card shadow-sm" th:unless="${#lists.isEmpty(users)}">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Privacy</th>
                            <th>Pronouns</th>
                            <th>Description</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="table-primary">
                            <td></td>
                            <td>
                                <input type="text" name="username" form="create-user" required
                                    class="form-control form-control-sm" placeholder="Username">
                            </td>
                            <td>
                                <input type="email" name="email" form="create-user" required
                                    class="form-control form-control-sm mb-1" placeholder="Email">
                                <input type="password" name="password" form="create-user" required
                                    class="form-control form-control-sm" placeholder="Password"
                                    autocomplete="new-password">
                            </td>
                            <td>
                                <select name="role" form="create-user" class="form-select form-select-sm">
                                    <option value="USER" selected>USER</option>
                                    <option value="ADMIN">ADMIN</option>
                                </select>
                            </td>
                            <td>
                                <select name="privacy" form="create-user" class="form-select form-select-sm">
                                    <option value="public" selected>Public</option>
                                    <option value="private">Private</option>
                                </select>
                            </td>
                            <td>
                                <input type="text" name="pronouns" form="create-user"
                                    class="form-control form-control-sm" placeholder="he/him">
                            </td>
                            <td style="min-width: 250px;">
                                <input type="text" name="description" form="create-user" maxlength="250"
                                    class="form-control form-control-sm" placeholder="Description">
                            </td>
                            <td>
                                <form id="create-user" th:action="@{/admin/createUser}" method="post">
                                    <button type="submit" class="btn btn-sm btn-primary">Create</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.id}">1</td>
                            <td>
                                <a th:href="@{/users/{id}(id=${u.id})}" th:text="${u.username}">username</a>
                            </td>
                            <td th:text="${u.email}">email@example.com</td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <span class="badge text-bg-secondary" th:text="${u.role}">USER</span>
                                    <form th:action="@{/admin/{id}/toggleRole(id=${u.id})}" method="post"
                                        onsubmit="return confirm('Change this user\'s role?');">
                                        <button type="submit" class="btn btn-sm btn-outline-primary text-nowrap"
                                                th:text="${u.role.name() == 'ADMIN'} ? 'Make user' : 'Make admin'">Toggle</button>
                                    </form>
                                </div>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${#strings.equalsIgnoreCase(u.privacy, 'private')} ? 'text-bg-warning' : 'text-bg-success'"
                                      th:text="${u.privacy}">PUBLIC</span>
                            </td>
                            <td class="text-muted" th:text="${u.pronouns}"></td>
                            <td style="min-width: 250px;">
                                <form th:action="@{/admin/{id}/editDescription(id=${u.id})}" method="post"
                                    class="input-group input-group-sm">
                                    <input type="text" name="description" class="form-control"
                                        th:value="${u.description}" maxlength="250"
                                        placeholder="No description">
                                    <button type="submit" class="btn btn-outline-primary">Save</button>
                                </form>
                            </td>
                            <td>
                                <form th:action="@{/admin/{id}/delete(id=${u.id})}" method="post"
                                    th:if="${u.id != currentUserId}"
                                    onsubmit="return confirm('Delete this user? This cannot be undone.');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
