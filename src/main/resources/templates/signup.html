<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - GamerBoxd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 400px;">
    <h1 class="mb-4">Sign Up</h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/signup}" method="post" class="card card-body shadow-sm">
        <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input type="text" class="form-control" id="username" name="username" th:value="${username}"
                   minlength="3" maxlength="30" autocomplete="username" aria-describedby="usernameHelp" required autofocus>
            <div class="form-text" id="usernameHelp">3-30 letters, numbers, underscores, or hyphens.</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" th:value="${email}"
                   maxlength="254" autocomplete="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   minlength="8" autocomplete="new-password" aria-describedby="passwordHelp" required>
            <div class="form-text" id="passwordHelp">At least 8 characters.</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                   minlength="8" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
    </form>

    <p class="text-center mt-3">Already have an account? <a th:href="@{/login}">Sign in</a></p>
</div>
</body>
</html>
