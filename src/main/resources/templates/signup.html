<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Create account')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container auth-wrap">
        <h1 class="mb-1">Create your account</h1>
        <p class="text-muted mb-4">Start logging the games you play.</p>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/signup}" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" th:value="${username}"
                    minlength="3" maxlength="30" autocomplete="username" aria-describedby="usernameHelp" required
                    autofocus>
                <div class="form-text" id="usernameHelp">3-30 letters, numbers, underscores, or hyphens.</div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" th:value="${email}" maxlength="254"
                    autocomplete="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" minlength="8"
                    autocomplete="new-password" aria-describedby="passwordHelp" required>
                <div class="form-text" id="passwordHelp">At least 8 characters.</div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirmPassword">Confirm password</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" minlength="8"
                    autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Create account</button>
        </form>
        <div class="divider">or</div>
        <a th:href="@{/auth/steam}" class="btn btn-provider btn-steam mb-2">
            <img th:src="@{/images/steam.svg}" alt="" width="22" height="22" class="icon-invert">
            Sign up with Steam
        </a>
        <a th:if="${googleSignInEnabled}" th:href="@{/oauth2/authorization/google}"
            class="btn btn-provider btn-light">
            <img th:src="@{/images/google.svg}" alt="" width="22" height="22">
            Sign up with Google
        </a>

        <p class="text-center text-muted mt-4">Already have an account? <a th:href="@{/login}">Sign in</a></p>
    </main>
    <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>

</html>
