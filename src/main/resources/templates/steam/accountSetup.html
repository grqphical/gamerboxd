<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Finish setting up')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container auth-wrap">
        <h1 class="mb-1" th:text="|Almost there, ${profile.name}|">Almost there</h1>
        <p class="text-muted mb-4">Add an email and password to finish creating your account.</p>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/auth/steam/finish}" method="post">
            <input type="text" id="username" name="username" th:value="${profile.name}" hidden>
            <input type="text" id="steamID" name="steamID" th:value="${profile.steamId}" hidden>
            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" th:value="${email}" maxlength="254"
                    autocomplete="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" minlength="8"
                    autocomplete="new-password" aria-describedby="passwordHelp" required>
                <div class="form-text" id="passwordHelp">At least 8 characters.</div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirmPassword">Confirm password</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" minlength="8"
                    autocomplete="new-password" required>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="importLibrary" name="importLibrary">
                <label class="form-check-label" for="importLibrary">Import my Steam library</label>
                <div class="form-text">Only works if your Steam profile is public.</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Create account</button>
        </form>
    </main>
    <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>

</html>
