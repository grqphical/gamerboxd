<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamerboxd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="/">Gamerboxd</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <form class="d-flex flex-grow-1 mx-lg-auto mt-3 mt-lg-0" style="max-width: 280px;" role="search"
                    th:action="@{/search}" method="get">
                    <input class="form-control me-2" type="search" name="q" placeholder="Search games"
                        aria-label="Search games" required>
                    <button class="btn btn-outline-primary" type="submit">Search</button>
                </form>

                <div class="ms-auto d-flex align-items-center gap-2 mt-3 mt-lg-0">
                    <a class="btn btn-outline-secondary" th:unless="${currentUser}" th:href="@{/login}">Sign In</a>
                    <a class="btn btn-primary" th:unless="${currentUser}" th:href="@{/signup}">Sign Up</a>

                    <div class="dropdown" th:if="${currentUser}">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false"
                            th:text="|Hello, ${currentUser.displayName}|">
                            Hello, username
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a class="dropdown-item" th:href="@{/users/{id}(id=${currentUser.id})}">
                                    Profile
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/users/{id}/settings(id=${currentUser.id})}">
                                    Account Settings
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item">Logout</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5" style="max-width: 800px;">
        <h1 class="mb-3" th:text="|Select Steam games to import|"></h1>
        <div class="alert alert-info mb-4" role="alert">
            You can always update/change the imported games in your Account Settings later. It also may take up to a couple minutes to fully import your library.</a>
        </div>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/auth/steam/link-library}" method="post">
            <div class="mb-3 d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="select-all">
                    Select all
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="deselect-all">
                    Deselect all
                </button>
                <button type="submit" class="btn btn-primary btn-sm ms-auto">Submit</button>
            </div>
        
            <div class="list-group mb-3 border rounded overflow-y-auto"
                 style="max-height: 60vh;">
                <label class="list-group-item d-flex align-items-center gap-3"
                       th:each="game : ${games}">
                    <input class="form-check-input flex-shrink-0 m-0"
                           type="checkbox"
                           name="selectedAppIds"
                           th:value="${game.appId}"
                           th:id="${'game-' + game.appId}">
                    <input type="hidden"
                           th:name="${'gameNames[' + game.appId + ']'}"
                           th:value="${game.gameName}"
                           disabled>
                    <img th:src="${game.iconURL}"
                         th:alt="${game.gameName}"
                         width="32" height="32"
                         class="rounded">
                    <span th:text="${game.gameName}">Game Name</span>
                </label>
            </div>
        
            <script>
                (function () {
                    const form = document.currentScript.closest('form');
                    const checkboxes = form.querySelectorAll('input[name="selectedAppIds"]');
        
                    // Enable the hidden name input only while its checkbox is checked
                    const sync = (cb) => {
                        cb.parentElement.querySelector('input[type="hidden"]').disabled = !cb.checked;
                    };
        
                    const setAll = (checked) =>
                        checkboxes.forEach(cb => {
                            cb.checked = checked;
                            sync(cb);
                        });
        
                    checkboxes.forEach(cb => cb.addEventListener('change', () => sync(cb)));
        
                    form.querySelector('#select-all').addEventListener('click', () => setAll(true));
                    form.querySelector('#deselect-all').addEventListener('click', () => setAll(false));
                })();
            </script>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
