<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Import Steam games')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container py-5" style="max-width: 800px;">
        <h1 class="mb-3" th:text="|Select Steam games to import|"></h1>
        <div class="alert alert-info mb-4" role="alert">
            You can always update/change the imported games in your Account Settings later. It also may take up to a couple minutes to fully import your library.</a>
        </div>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/auth/steam/link-library}" method="post">
            <div class="mb-3 d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="select-all">
                    Select all
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="deselect-all">
                    Deselect all
                </button>
                <button type="submit" class="btn btn-primary btn-sm ms-auto">Submit</button>
            </div>
        
            <div class="list-group mb-3 border rounded overflow-y-auto"
                 style="max-height: 60vh;">
                <label class="list-group-item d-flex align-items-center gap-3"
                       th:each="game : ${games}">
                    <input class="form-check-input flex-shrink-0 m-0"
                           type="checkbox"
                           name="selectedAppIds"
                           th:value="${game.appId}"
                           th:id="${'game-' + game.appId}">
                    <input type="hidden"
                           th:name="${'gameNames[' + game.appId + ']'}"
                           th:value="${game.gameName}"
                           disabled>
                    <img th:src="${game.iconURL}"
                         th:alt="${game.gameName}"
                         width="32" height="32"
                         class="rounded">
                    <span th:text="${game.gameName}">Game Name</span>
                </label>
            </div>
        
            <script>
                (function () {
                    const form = document.currentScript.closest('form');
                    const checkboxes = form.querySelectorAll('input[name="selectedAppIds"]');
        
                    // Enable the hidden name input only while its checkbox is checked
                    const sync = (cb) => {
                        cb.parentElement.querySelector('input[type="hidden"]').disabled = !cb.checked;
                    };
        
                    const setAll = (checked) =>
                        checkboxes.forEach(cb => {
                            cb.checked = checked;
                            sync(cb);
                        });
        
                    checkboxes.forEach(cb => cb.addEventListener('change', () => sync(cb)));
        
                    form.querySelector('#select-all').addEventListener('click', () => setAll(true));
                    form.querySelector('#deselect-all').addEventListener('click', () => setAll(false));
                })();
            </script>
        </form>
    </div>
    <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
