<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamerboxd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-3 d-flex justify-content-end align-items-center gap-3">
        <a class="btn btn-link me-auto" th:href="@{/reviews}">Reviews</a>
        <a class="btn btn-outline-secondary" th:unless="${currentUser}" th:href="@{/login}">Sign In</a>
        <a class="btn btn-primary" th:unless="${currentUser}" th:href="@{/signup}">Sign Up</a>
        <a th:if="${currentUser}" th:href="@{/users/{id}(id=${currentUser.id})}" th:text="${currentUser.displayName}"></a>
        <form th:if="${currentUser}" th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-outline-secondary">Sign Out</button>
        </form>
    </div>
</body>

</html>
