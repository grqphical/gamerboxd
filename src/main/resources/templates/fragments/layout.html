<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- Shared page chrome: <head>, navbar, footer and scripts. -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ? |${title} · Gamerboxd| : 'Gamerboxd'">Gamerboxd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link th:href="@{/css/gamerboxd.css}" rel="stylesheet">
</head>

<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg gb-nav">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z" />
                </svg>
                gamerboxd
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-3">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Reviews</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/playlists}">Playlists</a></li>
                </ul>

                <form class="gb-search flex-grow-1 my-2 my-lg-0" style="max-width: 320px;" role="search"
                    th:action="@{/search}" method="get">
                    <input class="form-control" type="search" name="q" placeholder="Search games…"
                        aria-label="Search games" required>
                </form>

                <div class="ms-auto d-flex align-items-center gap-2 mt-2 mt-lg-0">
                    <a class="btn btn-ghost" th:unless="${currentUser}" th:href="@{/login}">Sign in</a>
                    <a class="btn btn-primary" th:unless="${currentUser}" th:href="@{/signup}">Create account</a>

                    <th:block th:if="${currentUser}">
                        <a class="btn btn-primary btn-sm" th:href="@{/reviews/new}">+ Review</a>
                        <div class="dropdown">
                            <button class="btn btn-ghost dropdown-toggle d-flex align-items-center gap-2" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                <span class="avatar" th:text="${#strings.substring(currentUser.displayName, 0, 1)}">u</span>
                                <span th:text="${currentUser.displayName}">username</span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" th:href="@{/users/{id}(id=${currentUser.id})}">Profile</a></li>
                                <li>
                                    <a class="dropdown-item"
                                        th:href="@{/users/{id}/settings(id=${currentUser.id})}">Settings</a>
                                </li>
                                <li th:if="${currentUser.authorities.![authority].contains('ROLE_ADMIN')}">
                                    <a class="dropdown-item" th:href="@{/admin}">Admin panel</a>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form th:action="@{/logout}" method="post" class="m-0">
                                        <button type="submit" class="dropdown-item">Sign out</button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </th:block>
                </div>
            </div>
        </div>
    </nav>

    <th:block th:fragment="footer">
        <footer class="gb-footer">
            <div class="container d-flex flex-wrap justify-content-between gap-2">
                <span>Gamerboxd · a diary for the games you play</span>
                <span>Game data from <a href="https://www.igdb.com" rel="noopener">IGDB</a></span>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/local-dates.js}"></script>
        <script th:src="@{/js/app.js}"></script>
    </th:block>
</body>

</html>
