<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Playlists')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container pt-4" style="max-width: 860px;">
        <div class="d-flex justify-content-between align-items-end">
            <div>
                <h1 class="mb-1">Playlists</h1>
                <p class="text-muted mb-0">Collections of games, curated by the community.</p>
            </div>
            <button th:if="${currentUser}" class="btn btn-primary" type="button" data-bs-toggle="collapse"
                data-bs-target="#newPlaylist" aria-controls="newPlaylist">New playlist</button>
            <a th:unless="${currentUser}" class="btn btn-outline-secondary" th:href="@{/login}">Sign in to create one</a>
        </div>

        <div class="alert alert-danger mt-3" th:if="${error}" th:text="${error}"></div>

        <form th:if="${currentUser}" id="newPlaylist" th:action="@{/playlists}" method="post"
            class="collapse card card-body mt-3" th:classappend="${error} ? 'show'">
            <div class="mb-3">
                <label class="form-label" for="title">Title</label>
                <input class="form-control" id="title" name="title" maxlength="100"
                    placeholder="e.g. Cozy games for a rainy weekend" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="description">Description</label>
                <textarea class="form-control" id="description" name="description" rows="2"
                    maxlength="1000"></textarea>
            </div>
            <button type="submit" class="btn btn-primary align-self-start">Create and add games</button>
        </form>

        <div class="section-title">
            <h2>Recently created</h2>
        </div>
        <p class="text-muted" th:if="${#lists.isEmpty(playlists)}">No playlists yet.</p>

        <div class="list-group">
            <a class="list-group-item list-group-item-action py-3" th:each="p : ${playlists}"
                th:href="@{/playlists/{id}(id=${p.id})}">
                <div class="d-flex justify-content-between align-items-start gap-3">
                    <div style="min-width: 0;">
                        <div class="review-title" th:text="${p.title}">Title</div>
                        <div class="text-muted small text-truncate" th:if="${!#strings.isEmpty(p.description)}"
                            th:text="${p.description}"></div>
                        <div class="review-meta mt-1 d-flex align-items-center gap-2">
                            <span class="avatar" th:text="${#strings.substring(p.username, 0, 1)}">u</span>
                            <span th:text="${p.username}">username</span>
                        </div>
                    </div>
                    <div class="text-end text-nowrap review-meta">
                        <div th:text="|${p.gameCount} ${p.gameCount == 1 ? 'game' : 'games'}|">0 games</div>
                        <div th:text="|♥ ${p.likeCount}|">♥ 0</div>
                    </div>
                </div>
            </a>
        </div>
    </main>
    <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>

</html>
