<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlists - Gamerboxd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div class="container py-5" style="max-width: 700px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Playlists</h1>
            <button th:if="${currentUser}" class="btn btn-primary" type="button" data-bs-toggle="collapse"
                data-bs-target="#newPlaylist" aria-controls="newPlaylist">New Playlist</button>
        </div>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:if="${currentUser}" id="newPlaylist" th:action="@{/playlists}" method="post"
            class="collapse card card-body shadow-sm mb-4" th:classappend="${error} ? 'show'">
            <div class="mb-3">
                <label class="form-label" for="title">Title</label>
                <input class="form-control" id="title" name="title" maxlength="100" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="description">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3"
                    maxlength="1000"></textarea>
            </div>
            <button type="submit" class="btn btn-primary align-self-start">Create</button>
        </form>

        <p class="text-muted" th:if="${#lists.isEmpty(playlists)}">No playlists yet.</p>

        <div class="card shadow-sm mb-3" th:each="p : ${playlists}">
            <div class="card-body">
                <h5 class="card-title">
                    <a th:href="@{/playlists/{id}(id=${p.id})}" class="text-reset text-decoration-none"
                        th:text="${p.title}">Title</a>
                </h5>
                <p class="card-text" th:if="${!#strings.isEmpty(p.description)}" th:text="${p.description}"></p>
                <small class="text-muted">
                    <a th:href="@{/users/{id}(id=${p.userId})}" th:text="${p.username}">username</a>
                    · <span th:text="|${p.gameCount} ${p.gameCount == 1 ? 'game' : 'games'}|">0 games</span>
                    · <span th:text="|♥ ${p.likeCount}|">♥ 0</span>
                </small>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
