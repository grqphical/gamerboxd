<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${playlist.title} - Gamerboxd|">Playlist - Gamerboxd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav th:replace="~{fragments/navbar :: navbar}"></nav>
    <div class="container py-5" style="max-width: 700px;">
        <h1 class="mb-1" th:text="${playlist.title}">Title</h1>
        <p class="text-muted mb-2">
            by <a th:href="@{/users/{id}(id=${playlist.user.id})}" th:text="${playlist.user.username}">username</a>
            · <span th:text="|${itemCount} ${itemCount == 1 ? 'game' : 'games'}|">0 games</span>
            · <time th:attr="datetime=${playlist.createdAt}" th:text="${playlist.createdAt}"></time>
        </p>
        <p th:if="${!#strings.isEmpty(playlist.description)}" th:text="${playlist.description}"></p>
        <p class="text-muted small" th:if="${isOwner and playlist.user.isPrivateAccount}">
            Only you can see this playlist because your account is set to private
        </p>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <div class="d-flex align-items-center gap-2 mb-4">
            <form th:if="${currentUser}" th:action="@{/playlists/{id}/like(id=${playlist.id})}" method="post"
                class="m-0">
                <button type="submit" class="btn btn-sm"
                    th:classappend="${liked} ? 'btn-danger' : 'btn-outline-danger'"
                    th:text="${liked} ? '♥ Liked' : '♡ Like'">♡ Like</button>
            </form>
            <span class="text-muted small" th:text="|♥ ${likeCount}|">♥ 0</span>

            <th:block th:if="${isOwner}">
                <button class="btn btn-sm btn-outline-secondary" type="button" data-bs-toggle="collapse"
                    data-bs-target="#editPlaylist" aria-controls="editPlaylist">Edit</button>
                <form th:action="@{/playlists/{id}/delete(id=${playlist.id})}" method="post" class="m-0"
                    onsubmit="return confirm('Delete this playlist?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </th:block>
        </div>

        <th:block th:if="${isOwner}">
            <form id="editPlaylist" th:action="@{/playlists/{id}(id=${playlist.id})}" method="post"
                class="collapse card card-body shadow-sm mb-4">
                <div class="mb-3">
                    <label class="form-label" for="title">Title</label>
                    <input class="form-control" id="title" name="title" maxlength="100" required
                        th:value="${playlist.title}">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="description">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3" maxlength="1000"
                        th:text="${playlist.description}"></textarea>
                </div>
                <button type="submit" class="btn btn-primary align-self-start">Save</button>
            </form>

            <!-- Categories already used in this playlist, offered as suggestions -->
            <datalist id="categories">
                <option th:each="entry : ${itemsByCategory}" th:if="${!#strings.isEmpty(entry.key)}"
                    th:value="${entry.key}"></option>
            </datalist>

            <div class="card card-body shadow-sm mb-4">
                <form th:action="@{/playlists/{id}(id=${playlist.id})}" method="get" class="d-flex gap-2">
                    <input type="search" name="q" class="form-control" placeholder="Search for a game to add"
                        th:value="${query}" required>
                    <button type="submit" class="btn btn-primary">Search</button>
                </form>
                <p class="text-muted mt-2 mb-0" th:if="${!#strings.isEmpty(query) and #lists.isEmpty(gameResults)}">
                    No games found.
                </p>
                <ul class="list-group mt-2" th:unless="${#lists.isEmpty(gameResults)}">
                    <li class="list-group-item" th:each="game : ${gameResults}">
                        <form th:action="@{/playlists/{id}/items(id=${playlist.id})}" method="post"
                            class="d-flex align-items-center gap-2">
                            <input type="hidden" name="gameId" th:value="${game.id}">
                            <span class="small fw-semibold flex-grow-1" th:text="${game.name}">Game</span>
                            <input class="form-control form-control-sm" style="max-width: 150px;" name="category"
                                list="categories" maxlength="50" placeholder="Category" aria-label="Category">
                            <select class="form-select form-select-sm w-auto" name="rating" aria-label="Rating">
                                <option value="">No rating</option>
                                <option th:each="n : ${#numbers.sequence(5, 1)}" th:value="${n}"
                                    th:text="${#strings.repeat('★', n)}"></option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-primary">Add</button>
                        </form>
                    </li>
                </ul>
            </div>
        </th:block>

        <p class="text-muted" th:if="${itemCount == 0}">No games in this playlist yet.</p>

        <section class="mb-4" th:each="entry : ${itemsByCategory}">
            <h5 th:text="${#strings.isEmpty(entry.key)} ? 'Uncategorised' : ${entry.key}"
                th:unless="${#strings.isEmpty(entry.key) and itemsByCategory.size() == 1}">Category</h5>
            <ul class="list-group">
                <li class="list-group-item p-2 d-flex align-items-center gap-2" th:each="item : ${entry.value}"
                    th:with="game=${games[item.gameId]}">
                    <a th:href="@{/games/{id}(id=${item.gameId})}"
                        class="d-flex align-items-center gap-2 flex-grow-1 text-reset text-decoration-none">
                        <img th:if="${game != null and game.coverLink != null}" th:src="${game.coverLink}"
                            class="rounded" style="width: 42px; height: 56px; object-fit: cover;" alt="">
                        <span class="small fw-semibold" th:text="${game != null ? game.name : 'Unknown game'}"></span>
                    </a>
                    <span class="text-warning" th:if="${!isOwner and item.rating != null}"
                        th:text="${#strings.repeat('★', item.rating)}">★★★</span>

                    <th:block th:if="${isOwner}">
                        <form th:action="@{/playlists/{id}/items/{itemId}(id=${playlist.id}, itemId=${item.id})}"
                            method="post" class="d-flex gap-1">
                            <input class="form-control form-control-sm" style="max-width: 150px;" name="category"
                                list="categories" maxlength="50" placeholder="Category" aria-label="Category"
                                th:value="${item.category}">
                            <select class="form-select form-select-sm w-auto" name="rating" aria-label="Rating">
                                <option value="">No rating</option>
                                <option th:each="n : ${#numbers.sequence(5, 1)}" th:value="${n}"
                                    th:selected="${n == item.rating}" th:text="${#strings.repeat('★', n)}"></option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-outline-primary">Save</button>
                        </form>
                        <form method="post"
                            th:action="@{/playlists/{id}/items/{itemId}/delete(id=${playlist.id}, itemId=${item.id})}">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                aria-label="Remove game">×</button>
                        </form>
                    </th:block>
                </li>
            </ul>
        </section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/local-dates.js}"></script>
</body>

</html>
