<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Account Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="/">Gamerboxd</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <div class="ms-auto d-flex align-items-center gap-2 mt-3 mt-lg-0">
                    <a class="btn btn-outline-secondary" th:unless="${currentUser}" th:href="@{/login}">Sign In</a>
                    <a class="btn btn-primary" th:unless="${currentUser}" th:href="@{/signup}">Sign Up</a>

                    <div class="dropdown" th:if="${currentUser}">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false"
                            th:text="|Hello, ${currentUser.displayName}|">
                            Hello, username
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a class="dropdown-item" th:href="@{/users/{id}(id=${currentUser.id})}">
                                    Profile
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/users/{id}/settings(id=${currentUser.id})}">
                                    Account Settings
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item">Logout</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <div class="container py-5" style="max-width: 400px;">
        <h1 class="mb-4">Settings</h1>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}" style="white-space: pre-line"></div>

        <form th:action="@{/users/{id}/settings(id=${user.id})}" method="post"
            onsubmit="return document.getElementById('password').value === '' || confirm('Are you sure you want to change your password?');">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" th:value="${user.email}">
            </div>

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" th:value="${user.username}">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">New Password</label>
                <input type="password" id="password" name="password" class="form-control"
                    placeholder="Leave blank to keep current password" autocomplete="new-password">
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <input type="text" id="description" name="description" class="form-control"
                    th:value="${user.description}">
            </div>

            <div class="mb-3">
                <label for="pronouns" class="form-label">Pronouns</label>
                <input type="text" id="pronouns" name="pronouns" class="form-control" th:value="${user.pronouns}">
            </div>

            <div class="mb-4 form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="privacy" name="privacy"
                    value="private" th:checked="${#strings.equalsIgnoreCase(user.privacy.name(), 'private')}"
                    onchange="this.nextElementSibling.textContent = this.checked ? 'Privacy: Private' : 'Privacy: Public'">
                <label class="form-check-label" for="privacy"
                    th:text="${#strings.equalsIgnoreCase(user.privacy.name(), 'private')} ? 'Privacy: Private' : 'Privacy: Public'">Privacy:
                    Public</label>
            </div>
            <div class="mb-4" th:if="${user.steamID == null}">
                <a href="/auth/steam"
                    class="btn btn-dark d-inline-flex align-items-center gap-2 px-3 py-2 text-decoration-none shadow-sm"
                    style="background-color: #171a21; border-color: #171a21;">
                    <img src="/images/steam.svg" alt="Steam logo" width="24" height="24"
                        style="filter: brightness(0) invert(1);">
                    <span class="fw-semibold text-white">Link Steam Account</span>
                </a>
            </div>
            <div class="mb-4" th:if="${user.steamID != null}">
                <img src="/images/steam.svg" alt="Steam logo" width="24" height="24" style="color: black !important;">
                <span class="fw-semibold">Steam Account Linked!</span>
                <a href="/auth/steam/unlink"
                    onclick="confirm('Are you sure you wish to unlink your Steam account?')">Unlink</a>
            </div>

            <div class="d-flex justify-content-between">
                <a th:href="@{/users/{id}(id=${user.id})}" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Apply</button>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
