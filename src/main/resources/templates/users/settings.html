<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Account Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 400px;">
    <h1 class="mb-4">Settings</h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/users/{id}/settings(id=${user.id})}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email"
                   class="form-control" th:value="${user.email}">
        </div>

        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username"
                   class="form-control" th:value="${user.username}">
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">New Password</label>
            <input type="password" id="password" name="password"
                   class="form-control" placeholder="Leave blank to keep current password"
                   autocomplete="new-password">
        </div>

        <div class="d-flex justify-content-between">
            <a th:href="@{/users/{id}(id=${user.id})}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Apply</button>
        </div>
    </form>
</div>
</body>
</html>
