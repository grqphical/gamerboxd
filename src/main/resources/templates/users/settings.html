<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Settings')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container pt-4" style="max-width: 620px;">
        <h1 class="mb-3">Settings</h1>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}" style="white-space: pre-line"></div>
        <div class="alert alert-danger" th:if="${param.googleTaken}">That Google account is already linked to another user.</div>

        <form th:action="@{/users/{id}/settings(id=${user.id})}" method="post"
            onsubmit="return document.getElementById('password').value === '' || confirm('Are you sure you want to change your password?');">
            <div class="section-title">
                <h2>Profile</h2>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" th:value="${user.username}">
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Bio</label>
                <input type="text" id="description" name="description" class="form-control" maxlength="250"
                    th:value="${user.description}">
            </div>
            <div class="mb-3">
                <label for="pronouns" class="form-label">Pronouns</label>
                <input type="text" id="pronouns" name="pronouns" class="form-control" th:value="${user.pronouns}">
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="privacy" name="privacy"
                    value="private" th:checked="${#strings.equalsIgnoreCase(user.privacy.name(), 'private')}">
                <label class="form-check-label" for="privacy">Private account</label>
                <div class="form-text">Only you can see your reviews, library and playlists.</div>
            </div>

            <div class="section-title">
                <h2>Account</h2>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" th:value="${user.email}">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">New password</label>
                <input type="password" id="password" name="password" class="form-control"
                    placeholder="Leave blank to keep your current password" autocomplete="new-password">
            </div>

            <div class="section-title">
                <h2>Connected accounts</h2>
            </div>
            <div class="list-group mb-4">
                <div class="list-group-item d-flex flex-wrap align-items-center gap-3 py-3">
                    <img th:src="@{/images/steam.svg}" alt="" width="28" height="28" class="icon-invert">
                    <div class="flex-grow-1">
                        <div class="fw-medium">Steam</div>
                        <small th:class="${user.steamID != null} ? 'text-success' : 'text-muted'"
                            th:text="${user.steamID != null} ? 'Connected' : 'Not connected'">Not connected</small>
                    </div>
                    <a th:if="${user.steamID == null}" th:href="@{/auth/steam}"
                        class="btn btn-sm btn-outline-secondary">Connect</a>
                    <th:block th:if="${user.steamID != null}">
                        <a th:href="@{/auth/steam/sync-library}" class="btn btn-sm btn-outline-secondary">Sync
                            library</a>
                        <a th:href="@{/auth/steam/unlink}" class="btn btn-sm btn-ghost danger"
                            onclick="return confirm('Are you sure you wish to unlink your Steam account?')">Unlink</a>
                    </th:block>
                </div>
                <div class="list-group-item d-flex flex-wrap align-items-center gap-3 py-3"
                    th:if="${googleSignInEnabled or user.googleID != null}">
                    <img th:src="@{/images/google.svg}" alt="" width="28" height="28">
                    <div class="flex-grow-1">
                        <div class="fw-medium">Google</div>
                        <small th:class="${user.googleID != null} ? 'text-success' : 'text-muted'"
                            th:text="${user.googleID != null} ? 'Connected' : 'Not connected'">Not connected</small>
                    </div>
                    <a th:if="${user.googleID == null}" th:href="@{/auth/google/link}"
                        class="btn btn-sm btn-outline-secondary">Connect</a>
                    <!-- Posts the surrounding form (and its CSRF token) to the unlink endpoint instead -->
                    <button th:if="${user.googleID != null}" type="submit" th:formaction="@{/auth/google/unlink}"
                        formmethod="post" formnovalidate class="btn btn-sm btn-ghost danger"
                        onclick="return confirm('Unlink your Google account? Make sure you have set a password first, or you will not be able to sign back in.')">Unlink</button>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4">Save changes</button>
                <a th:href="@{/users/{id}(id=${user.id})}" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </main>
    <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>

</html>
