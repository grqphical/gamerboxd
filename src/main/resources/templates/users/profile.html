<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="|${user.username} - Gamerboxd|"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="/">Gamerboxd</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <div class="ms-auto d-flex align-items-center gap-2 mt-3 mt-lg-0">
                    <a class="btn btn-outline-secondary" th:unless="${currentUser}" th:href="@{/login}">Sign In</a>
                    <a class="btn btn-primary" th:unless="${currentUser}" th:href="@{/signup}">Sign Up</a>

                    <div class="dropdown" th:if="${currentUser}">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false"
                            th:text="|Hello, ${currentUser.displayName}|">
                            Hello, username
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a class="dropdown-item" th:href="@{/users/{id}(id=${currentUser.id})}">
                                    Profile
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/users/{id}/settings(id=${currentUser.id})}">
                                    Account Settings
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item">Logout</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <div class="container py-5" style="max-width: 700px;">
        <div class="d-flex justify-content-between align-items-start mb-3">
            <h1 class="mb-0">
                <span th:text="${user.username}"></span>
                <small class="text-muted fs-6" th:if="${user.isPrivateAccount}">(Private)</small>
                <small class="text-muted fs-6" th:if="${!#strings.isEmpty(user.pronouns)}"
                    th:text="${user.pronouns}"></small>
            </h1>
            <div class="d-flex flex-row gap-2">
                <a th:if="${isOwnProfile}" th:href="@{/users/{id}/settings(id=${user.id})}"
                    class="btn btn-outline-secondary">Settings</a>
                <a th:if="${currentUser != null and currentUser.authorities.![authority].contains('ROLE_ADMIN')}"
                    th:href="@{/admin}" class="btn btn-outline-danger">Admin Panel</a>
            </div>
        </div>

        <p class="mb-4" th:if="${!#strings.isEmpty(user.description)}" th:text="${user.description}"></p>

        <div th:unless="${user.isPrivateAccount and !isOwnProfile}">
            <h3>User Reviews:</h3>
            <p class="text-muted" th:if="${#lists.isEmpty(reviews)}">No reviews yet.</p>
            <p class="text-muted" th:if="${!#lists.isEmpty(reviews) and user.isPrivateAccount}">
                Only you can see your reviews because your account is set to private
            </p>
            <div class="card shadow-sm mb-3" th:each="r : ${reviews}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${r.gameName}">Game</h5>
                    <div class="text-warning mb-2" th:text="${#strings.repeat('★', r.rating)}">★★★</div>
                    <p class="card-text" th:text="${r.description}">Description</p>
                    <small class="text-muted">
                        <span th:text="${#temporals.format(r.createdAt, 'MMM d, yyyy')}"></span>
                        <span th:if="${r.updatedAt != null}" class="fst-italic"
                            th:text="'· edited ' + ${#temporals.format(r.updatedAt, 'MMM d, yyyy')}"></span>
                    </small>
                    <div th:if="${currentUser != null and currentUser.id == r.user.id}" class="mt-2">
                        <a th:href="@{/reviews/{id}/edit(id=${r.id}, from='profile')}"
                            class="btn btn-sm btn-outline-secondary">Edit</a>
                        <form th:action="@{/reviews/{id}/delete(id=${r.id}, from='profile')}" method="post"
                            class="d-inline" onsubmit="return confirm('Delete this review?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
