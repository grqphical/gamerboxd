<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Edit review')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container pt-4" style="max-width: 680px;">
        <h1 class="mb-1">Edit review</h1>
        <p class="text-muted">
            <a th:href="@{/games/{id}(id=${review.gameId})}" th:text="${gameName ?: 'Unknown game'}">Game</a>
        </p>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/reviews/{id}(id=${review.id})}" method="post">
            <input type="hidden" name="from" th:if="${from}" th:value="${from}">
            <div class="mb-3">
                <div th:replace="~{fragments/components :: starInput(${review.rating})}"></div>
            </div>
            <textarea class="form-control mb-3" id="description" name="description" rows="6" maxlength="2000"
                aria-label="Review" required th:text="${review.description}"></textarea>
            <button type="submit" class="btn btn-primary px-4">Save changes</button>
            <a th:href="${from == 'profile'} ? @{/users/{id}(id=${review.user.id})} : @{/}"
                class="btn btn-ghost">Cancel</a>
        </form>
    </main>
    <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>

</html>
