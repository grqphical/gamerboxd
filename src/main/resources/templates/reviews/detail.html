<div class="container py-5" style="max-width: 700px;">
    <a th:href="@{/}" class="btn btn-link ps-0 mb-2">&larr; Back</a>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title" th:text="${review.gameName}">Game</h5>
            <div class="text-warning mb-2" th:text="${#strings.repeat('★', review.rating)}">★★★</div>
            <p class="card-text" th:text="${review.description}">Description</p>
            <small class="text-muted">
                <a th:href="@{/users/{id}(id=${review.user.id})}" th:text="${review.user.username}">username</a>
                · <time th:attr="datetime=${review.createdAt}" th:text="${review.createdAt}"></time>
            </small>
        </div>
    </div>

    <h4>Comments</h4>
    <p class="text-muted" th:if="${#lists.isEmpty(comments)}">No comments yet.</p>

    <div class="card mb-2" th:each="c : ${comments}">
        <div class="card-body py-2">
            <div class="d-flex justify-content-between align-items-start">
                <small class="text-muted">
                    <a th:href="@{/users/{id}(id=${c.user.id})}" th:text="${c.user.username}">username</a>
                    · <time th:attr="datetime=${c.createdAt}" th:text="${c.createdAt}"></time>
                </small>
                <form th:if="${currentUser != null and currentUser.id == c.user.id}"
                      th:action="@{/comments/{id}/delete(id=${c.id}, reviewId=${review.id})}" method="post"
                      class="m-0" onsubmit="return confirm('Delete this comment?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </div>
            <p class="mb-0" th:text="${c.content}">Comment</p>
        </div>
    </div>

    <div class="alert alert-danger mt-3" th:if="${error}" th:text="${error}"></div>

    <form th:if="${currentUser}" th:action="@{/reviews/{id}/comments(id=${review.id})}" method="post" class="mt-3">
        <textarea class="form-control mb-2" name="content" rows="3" maxlength="1000"
                  placeholder="Write a comment..." required></textarea>
        <button type="submit" class="btn btn-primary">Comment</button>
    </form>
    <p class="text-muted mt-3" th:unless="${currentUser}"><a th:href="@{/login}">Sign in</a> to comment.</p>
</div>
