<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${gameName} + ' review | Gamerboxd'">Review | Gamerboxd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar bg-body-tertiary border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" th:href="@{/}">Gamerboxd</a>
            <a class="btn btn-outline-secondary btn-sm" th:if="${currentUser}"
                th:href="@{/users/{id}(id=${currentUser.id})}">Profile</a>
            <a class="btn btn-outline-secondary btn-sm" th:unless="${currentUser}" th:href="@{/login}">Sign In</a>
        </div>
    </nav>

    <main class="container py-4" style="max-width: 760px;">
        <a th:href="@{/}" class="text-decoration-none text-muted">&larr; Back to reviews</a>

        <article class="card shadow-sm mt-3 mb-4">
            <div class="card-body p-4">
                <h1 class="h3 mb-2">
                    <a class="text-reset text-decoration-none" th:href="@{/games/{id}(id=${review.gameId})}"
                        th:text="${gameName ?: 'Unknown game'}">Game</a>
                </h1>
                <div class="text-warning mb-3"
                    th:aria-label="${review.rating} + ' out of 5 stars'"
                    th:text="${#strings.repeat('★', review.rating)}">★★★★★</div>
                <p class="mb-4" style="white-space: pre-line;" th:text="${review.description}">Review text</p>
                <div class="d-flex justify-content-between align-items-center border-top pt-3">
                    <small class="text-muted">
                        By <a th:href="@{/users/{id}(id=${review.user.id})}"
                            th:text="${review.user.username}">username</a>
                        · <time th:attr="datetime=${review.createdAt}" th:text="${review.createdAt}"></time>
                        <span th:if="${review.updatedAt != null}" class="fst-italic">· edited</span>
                    </small>
                    <a th:if="${currentUser != null and currentUser.id == review.user.id}"
                        th:href="@{/reviews/{id}/edit(id=${review.id})}"
                        class="btn btn-sm btn-outline-secondary">Edit</a>
                </div>
            </div>
        </article>

        <section aria-labelledby="commentsHeading">
            <h2 class="h4 mb-3" id="commentsHeading">
                Comments <span class="text-muted fw-normal"
                    th:text="'(' + ${#lists.size(comments)} + ')'">(0)</span>
            </h2>

            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
                    <form th:if="${currentUser}" th:action="@{/reviews/{id}/comments(id=${review.id})}" method="post">
                        <label for="commentContent" class="form-label">Add a comment</label>
                        <textarea class="form-control mb-2" id="commentContent" name="content" rows="3"
                            maxlength="1000" placeholder="Write a comment..." required></textarea>
                        <button type="submit" class="btn btn-primary">Post comment</button>
                    </form>
                    <p class="mb-0 text-muted" th:unless="${currentUser}">
                        <a th:href="@{/login}">Sign in</a> to comment.
                    </p>
                </div>
            </div>

            <p class="text-muted" th:if="${#lists.isEmpty(comments)}">No comments yet.</p>
            <div class="card shadow-sm mb-2" th:each="c : ${comments}">
                <div class="card-body py-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <small class="text-muted">
                            <a th:href="@{/users/{id}(id=${c.user.id})}"
                                th:text="${c.user.username}">username</a>
                            · <time th:attr="datetime=${c.createdAt}" th:text="${c.createdAt}"></time>
                        </small>
                        <form th:if="${currentUser != null and currentUser.id == c.user.id}"
                            th:action="@{/comments/{id}/delete(id=${c.id}, reviewId=${review.id})}"
                            method="post" class="m-0"
                            onsubmit="return confirm('Delete this comment?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </div>
                    <p class="mb-0" style="white-space: pre-line;" th:text="${c.content}">Comment</p>
                </div>
            </div>
        </section>
    </main>
    <script th:src="@{/js/local-dates.js}"></script>
</body>

</html>
