<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(|${review.user.username} on ${gameName ?: 'a game'}|)}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container pt-4" style="max-width: 760px;">
        <article class="d-flex gap-4 mb-2">
            <div style="width: 130px; flex-shrink: 0;" class="d-none d-sm-block">
                <a th:replace="~{fragments/components :: poster(${game})}"></a>
            </div>
            <div class="flex-grow-1" style="min-width: 0;">
                <div class="review-meta d-flex align-items-center gap-2 mb-1">
                    <span class="avatar" th:text="${#strings.substring(review.user.username, 0, 1)}">u</span>
                    Review by <a th:href="@{/users/{id}(id=${review.user.id})}"
                        th:text="${review.user.username}">username</a>
                </div>
                <h1 class="mb-1">
                    <a class="text-reset" th:href="@{/games/{id}(id=${review.gameId})}"
                        th:text="${gameName ?: 'Unknown game'}">Game</a>
                </h1>
                <div class="review-meta d-flex align-items-center gap-2 mb-3">
                    <span class="fs-5"><span th:replace="~{fragments/components :: stars(${review.rating})}"></span></span>
                    <time th:attr="datetime=${review.createdAt}" th:text="${review.createdAt}"></time>
                    <span th:if="${review.updatedAt != null}" class="fst-italic">edited</span>
                    <a th:if="${currentUser != null and currentUser.id == review.user.id}"
                        th:href="@{/reviews/{id}/edit(id=${review.id})}" class="btn btn-sm btn-ghost ms-auto">Edit</a>
                </div>
                <p class="fs-5" style="white-space: pre-line; overflow-wrap: anywhere;"
                    th:text="${review.description}">Review text</p>
            </div>
        </article>

        <section aria-labelledby="commentsHeading">
            <div class="section-title">
                <h2 id="commentsHeading">Comments · <span th:text="${#lists.size(comments)}">0</span></h2>
            </div>

            <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
            <form th:if="${currentUser}" th:action="@{/reviews/{id}/comments(id=${review.id})}" method="post"
                class="mb-4">
                <textarea class="form-control mb-2" id="commentContent" name="content" rows="2" maxlength="1000"
                    placeholder="Add a comment…" aria-label="Add a comment" required></textarea>
                <button type="submit" class="btn btn-primary btn-sm">Post comment</button>
            </form>
            <p class="text-muted" th:unless="${currentUser}"><a th:href="@{/login}">Sign in</a> to comment.</p>

            <p class="text-muted" th:if="${#lists.isEmpty(comments)}">No comments yet.</p>
            <div class="review" th:each="c : ${comments}">
                <span class="avatar mt-1" th:text="${#strings.substring(c.user.username, 0, 1)}">u</span>
                <div class="review-body">
                    <div class="review-meta d-flex align-items-center gap-2">
                        <a th:href="@{/users/{id}(id=${c.user.id})}" th:text="${c.user.username}">username</a>
                        <time th:attr="datetime=${c.createdAt}" th:text="${c.createdAt}"></time>
                        <form th:if="${currentUser != null and currentUser.id == c.user.id}"
                            th:action="@{/comments/{id}/delete(id=${c.id}, reviewId=${review.id})}" method="post"
                            class="m-0 ms-auto" onsubmit="return confirm('Delete this comment?');">
                            <button type="submit" class="btn btn-sm btn-ghost danger">Delete</button>
                        </form>
                    </div>
                    <p class="mb-0 mt-1" style="white-space: pre-line; overflow-wrap: anywhere;"
                        th:text="${c.content}">Comment</p>
                </div>
            </div>
        </section>
    </main>
    <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>

</html>
