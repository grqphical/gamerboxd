<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Write a review')}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container pt-4" style="max-width: 680px;">
        <h1 class="mb-1">Write a review</h1>
        <p class="text-muted" th:if="${isPrivateAccount}">
            Your account is private, so only you will see this review.
        </p>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <div class="section-title">
            <h2>1 · Pick a game</h2>
        </div>
        <form th:action="@{/reviews/new}" method="get" class="d-flex gap-2 mb-3">
            <input type="search" class="form-control" name="q" th:value="${query}" placeholder="Search by name"
                aria-label="Search for a game" required th:autofocus="${#lists.isEmpty(gameResults)}">
            <button type="submit" class="btn btn-outline-primary">Search</button>
        </form>
        <p class="text-muted small"
            th:if="${!#strings.isEmpty(query) and (gameResults == null or #lists.isEmpty(gameResults))}">
            No games found for “<span th:text="${query}">query</span>”. Try a different name.
        </p>

        <form th:action="@{/reviews}" method="post" th:unless="${gameResults == null or #lists.isEmpty(gameResults)}">
            <div class="poster-grid compact">
                <label class="game-choice" th:each="g : ${gameResults}">
                    <input type="radio" name="gameId" th:value="${g.id}" required
                        th:checked="${g.id == selectedGameId or #lists.size(gameResults) == 1}">
                    <span class="poster">
                        <img th:if="${g.coverLink != null}" th:src="${g.coverLink}" th:alt="${g.name}">
                        <span class="poster-fallback" th:unless="${g.coverLink != null}" th:text="${g.name}"></span>
                    </span>
                    <span class="poster-caption d-block">
                        <span class="name" th:text="${g.name}">Game</span>
                        <span class="meta" th:text="${g.releaseDate}">2020</span>
                    </span>
                </label>
            </div>

            <div class="section-title">
                <h2>2 · Rate it</h2>
            </div>
            <div th:replace="~{fragments/components :: starInput(${null})}"></div>

            <div class="section-title">
                <h2>3 · Say why</h2>
            </div>
            <textarea class="form-control mb-3" id="description" name="description" rows="6" maxlength="2000"
                placeholder="What did you think?" aria-label="Review" required></textarea>
            <button type="submit" class="btn btn-primary px-4">Post review</button>
            <a th:href="@{/}" class="btn btn-ghost">Cancel</a>
        </form>
    </main>
    <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>

</html>
