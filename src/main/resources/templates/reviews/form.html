<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Write a Review - GamerBoxd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 600px;">
    <a th:href="@{/reviews}" class="btn btn-link ps-0 mb-2">Back to reviews</a>
    <h1 class="mb-4">Write a Review</h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/reviews}" method="post" class="card card-body shadow-sm">
        <!-- TODO: replace with gameId once we have a game table -->
        <div class="mb-3">
            <label class="form-label" for="gameName">Game</label>
            <input type="text" class="form-control" id="gameName" name="gameName" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="rating">Rating</label>
            <select class="form-select" id="rating" name="rating" required>
                <option value="5">&#9733;&#9733;&#9733;&#9733;&#9733; (5)</option>
                <option value="4">&#9733;&#9733;&#9733;&#9733; (4)</option>
                <option value="3">&#9733;&#9733;&#9733; (3)</option>
                <option value="2">&#9733;&#9733; (2)</option>
                <option value="1">&#9733; (1)</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label" for="description">Review</label>
            <textarea class="form-control" id="description" name="description" rows="5" maxlength="2000" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Post Review</button>
    </form>
</div>
</body>
</html>
