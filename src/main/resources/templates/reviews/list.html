<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reviews - GamerBoxd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 700px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <a th:href="@{/}" class="btn btn-link ps-0">GamerBoxd</a>
        <h1 class="mb-0">Reviews</h1>
        <a th:href="@{/reviews/new}" class="btn btn-primary">Write a Review</a>
    </div>

    <p class="text-muted" th:if="${#lists.isEmpty(reviews)}">No reviews yet.</p>

    <div class="card shadow-sm mb-3" th:each="r : ${reviews}">
        <div class="card-body">
            <h5 class="card-title" th:text="${r.gameName}">Game</h5>
            <div class="text-warning mb-2"
                 th:text="${#strings.repeat('★', r.rating)}">★★★</div>
            <p class="card-text" th:text="${r.description}">Description</p>
            <small class="text-muted">
                <a th:href="@{/users/{id}(id=${r.user.id})}" th:text="${r.user.username}">username</a>
                · <span th:text="${#temporals.format(r.createdAt, 'MMM d, yyyy')}"></span>
                <span th:if="${r.updatedAt != null}" class="fst-italic"
                    th:text="'· edited ' + ${#temporals.format(r.updatedAt, 'MMM d, yyyy')}"></span>
            </small>
            <a th:if="${currentUser != null and currentUser.id == r.user.id}"
                th:href="@{/reviews/{id}/edit(id=${r.id})}"
                class="btn btn-sm btn-outline-secondary ms-2">Edit</a>
        </div>
    </div>
</div>
</body>
</html>
