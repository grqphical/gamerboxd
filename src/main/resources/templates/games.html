<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${game.name})}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="backdrop" th:if="${!#lists.isEmpty(game.artworkLinks)}">
        <img th:src="${#strings.replace(game.artworkLinks[0], 't_thumb', 't_1080p')}" alt="">
    </div>

    <main class="container game-head" style="max-width: 980px;"
        th:classappend="${#lists.isEmpty(game.artworkLinks)} ? 'pt-5'">
        <div class="row g-4">
            <div class="col-5 col-sm-4 col-md-3">
                <div class="poster">
                    <img th:if="${game.coverLink != null}" th:src="${game.coverLink}"
                        th:alt="'Cover of ' + ${game.name}">
                    <span class="poster-fallback" th:unless="${game.coverLink != null}">No cover</span>
                </div>
            </div>

            <div class="col-12 col-sm-8 col-md-9 d-flex flex-column justify-content-end">
                <h1 class="mb-1" style="font-size: 2.3rem;" th:text="${game.name}">Game name</h1>
                <p class="text-muted mb-2">
                    Released <span th:text="${game.releaseDate != null} ? ${game.releaseDate} : 'date unknown'">2020</span>
                </p>
                <div class="mb-3" th:if="${!#lists.isEmpty(game.genres)}">
                    <span class="badge text-bg-primary me-1" th:each="genre : ${game.genres}"
                        th:text="${genre}">Genre</span>
                </div>

                <div class="d-flex align-items-center flex-wrap gap-4">
                    <div class="d-flex align-items-center gap-3">
                        <span class="score" th:if="${game.numRatingsGamerboxd > 0}"
                            th:text="${#numbers.formatDecimal(game.ratingGamerboxd, 1, 1)}">4.2</span>
                        <span class="score text-muted" th:unless="${game.numRatingsGamerboxd > 0}">–</span>
                        <div class="small">
                            <div class="stars" th:if="${game.numRatingsGamerboxd > 0}"
                                th:text="${#strings.repeat('★', T(java.lang.Math).round(game.ratingGamerboxd))}">★★★★</div>
                            <div class="text-muted">
                                <span th:text="${game.numRatingsGamerboxd}">0</span>
                                <span th:text="${game.numRatingsGamerboxd == 1} ? 'rating' : 'ratings'">ratings</span>
                            </div>
                        </div>
                    </div>
                    <div class="stat" th:if="${game.ratingIGDB != null}">
                        <div class="value" th:text="${#numbers.formatDecimal(game.ratingIGDB, 1, 0)}">85</div>
                        <div class="label">IGDB score</div>
                    </div>
                    <a th:href="${currentUser} ? @{/reviews/new(gameId=${game.id})} : @{/login}"
                        class="btn btn-primary ms-sm-auto">Review this game</a>
                </div>
            </div>
        </div>

        <div class="row gx-lg-5 gy-0 mt-1">
            <div class="col-12 col-lg-7">
                <div class="section-title">
                    <h2>About</h2>
                </div>
                <p th:if="${!#strings.isEmpty(game.summary)}" th:text="${game.summary}">Summary text</p>
                <p class="text-muted" th:if="${#strings.isEmpty(game.summary)}">No summary available.</p>

                <div th:if="${!#lists.isEmpty(game.platforms)}">
                    <span class="badge text-bg-secondary me-1 mb-1" th:each="platform : ${game.platforms}"
                        th:text="${platform}">Platform</span>
                </div>

                <div class="section-title">
                    <h2>Reviews</h2>
                    <span class="small text-muted" th:text="${#lists.size(reviews)}">0</span>
                </div>
                <p class="text-muted" th:if="${#lists.isEmpty(reviews)}">
                    Nobody has reviewed this yet.
                    <a th:href="${currentUser} ? @{/reviews/new(gameId=${game.id})} : @{/login}">Write the first review</a>.
                </p>
                <th:block th:each="r : ${reviews}">
                    <article th:replace="~{fragments/components :: review(${r}, ${game}, 'game')}"></article>
                </th:block>
            </div>

            <div class="col-12 col-lg-5" th:if="${!#lists.isEmpty(game.artworkLinks)}">
                <div class="section-title">
                    <h2>Artwork</h2>
                </div>
                <div id="artworkCarousel" class="carousel slide rounded overflow-hidden">
                    <div class="carousel-inner">
                        <div class="carousel-item ratio ratio-16x9" th:each="art, stat : ${game.artworkLinks}"
                            th:classappend="${stat.first} ? 'active'">
                            <img class="object-fit-cover" th:src="${#strings.replace(art, 't_thumb', 't_1080p')}"
                                th:alt="${game.name} + ' artwork ' + ${stat.count}"
                                th:loading="${stat.first} ? 'eager' : 'lazy'">
                        </div>
                    </div>
                    <th:block th:if="${#lists.size(game.artworkLinks) > 1}">
                        <button class="carousel-control-prev" type="button" data-bs-target="#artworkCarousel"
                            data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#artworkCarousel"
                            data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </th:block>
                </div>
            </div>
        </div>
    </main>
    <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>

</html>
