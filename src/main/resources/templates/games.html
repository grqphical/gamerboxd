<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${game.name} + ' | Gamerboxd'">Game | Gamerboxd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="/">Gamerboxd</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <form class="d-flex flex-grow-1 mx-lg-auto mt-3 mt-lg-0" style="max-width: 280px;" role="search"
                    th:action="@{/search}" method="get">
                    <input class="form-control me-2" type="search" name="q" placeholder="Search games"
                        aria-label="Search games" required>
                    <button class="btn btn-outline-primary" type="submit">Search</button>
                </form>

                <div class="ms-auto d-flex align-items-center gap-2 mt-3 mt-lg-0">
                    <a class="btn btn-outline-secondary" th:unless="${currentUser}" th:href="@{/login}">Sign In</a>
                    <a class="btn btn-primary" th:unless="${currentUser}" th:href="@{/signup}">Sign Up</a>

                    <div class="dropdown" th:if="${currentUser}">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false"
                            th:text="|Hello, ${currentUser.displayName}|">
                            Hello, username
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a class="dropdown-item" th:href="@{/users/{id}(id=${currentUser.id})}">
                                    Profile
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/users/{id}/settings(id=${currentUser.id})}">
                                    Account Settings
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item">Logout</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>


<img class="img-fluid w-100 object-fit-cover"
     style="max-height: 400px;"
     th:if="${!#lists.isEmpty(game.artworkLinks)}"
     th:src="${#strings.replace(game.artworkLinks[0], 't_thumb', 't_1080p')}"
     th:alt="${game.name} + ' artwork'">

<main class="container py-4">
    <div class="row g-4">
        <div class="col-12 col-md-4 col-lg-3">
            <div class="ratio mb-3" style="--bs-aspect-ratio: 133.33%;">
                <img class="img-thumbnail object-fit-cover"
                     th:if="${game.coverLink != null}"
                     th:src="${game.coverLink}"
                     th:alt="'Cover of ' + ${game.name}">
                <div class="border bg-light d-flex align-items-center justify-content-center text-muted"
                     th:unless="${game.coverLink != null}">No cover</div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h2 class="h6 card-subtitle text-muted">Gamerboxd</h2>
                    <p class="h3 mb-0" th:if="${game.ratingGamerboxd != null}"
                       th:text="${#numbers.formatDecimal(game.ratingGamerboxd, 1, 1)}">4.2</p>
                    <p class="h3 mb-0 text-muted" th:unless="${game.ratingGamerboxd != null}">–</p>
                    <p class="small text-muted">
                        <span th:text="${game.numRatingsGamerboxd}">0</span>
                        <span th:text="${game.numRatingsGamerboxd == 1} ? 'rating' : 'ratings'">ratings</span>
                    </p>

                    <h2 class="h6 card-subtitle text-muted">IGDB</h2>
                    <p class="h5 mb-0" th:if="${game.ratingIGDB != null}"
                       th:text="${#numbers.formatDecimal(game.ratingIGDB, 1, 0)} + ' / 100'">85 / 100</p>
                    <p class="h5 mb-0 text-muted" th:unless="${game.ratingIGDB != null}">Not rated</p>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-8 col-lg-9">
            <h1 th:text="${game.name}">Game name</h1>
            <p class="text-muted">
                Released
                <span th:text="${game.releaseDate != null} ? ${game.releaseDate} : 'date unknown'">2020-01-01</span>
            </p>

            <div class="mb-3" th:if="${!#lists.isEmpty(game.genres)}">
                <span class="badge text-bg-primary me-1"
                      th:each="genre : ${game.genres}" th:text="${genre}">Genre</span>
            </div>

            <h2 class="h5">Summary</h2>
            <p th:if="${game.summary != null and !#strings.isEmpty(game.summary)}"
               th:text="${game.summary}">Summary text</p>
            <p class="text-muted"
               th:unless="${game.summary != null and !#strings.isEmpty(game.summary)}">No summary available.</p>

            <h2 class="h5 mt-4">Platforms</h2>
            <div th:if="${!#lists.isEmpty(game.platforms)}">
                <span class="badge text-bg-secondary me-1"
                      th:each="platform : ${game.platforms}" th:text="${platform}">Platform</span>
            </div>
            <p class="text-muted" th:if="${#lists.isEmpty(game.platforms)}">No platforms listed.</p>

            <div th:if="${!#lists.isEmpty(game.artworkLinks)}">
                <h2 class="h5 mt-4">Artwork</h2>
                <div id="artworkCarousel" class="carousel slide">

                    <div class="carousel-indicators" th:if="${#lists.size(game.artworkLinks) > 1}">
                        <button type="button" data-bs-target="#artworkCarousel"
                                th:each="art, stat : ${game.artworkLinks}"
                                th:attr="data-bs-slide-to=${stat.index}, aria-label='Slide ' + ${stat.count}"
                                th:classappend="${stat.first} ? 'active'"
                                th:aria-current="${stat.first} ? 'true'"></button>
                    </div>

                    <div class="carousel-inner">
                        <div class="carousel-item ratio ratio-16x9" th:each="art, stat : ${game.artworkLinks}"
                             th:classappend="${stat.first} ? 'active'">
                            <img class="object-fit-cover"
                                 th:src="${#strings.replace(art, 't_thumb', 't_1080p')}"
                                 th:alt="${game.name} + ' artwork ' + ${stat.count}"
                                 th:loading="${stat.first} ? 'eager' : 'lazy'">
                        </div>
                    </div>

                    <th:block th:if="${#lists.size(game.artworkLinks) > 1}">
                        <button class="carousel-control-prev" type="button"
                                data-bs-target="#artworkCarousel" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button"
                                data-bs-target="#artworkCarousel" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </th:block>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
