<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(${#strings.isEmpty(query)} ? 'Search' : |Search: ${query}|)}"></head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container pt-4" style="max-width: 980px;">
        <form th:action="@{/search}" method="get" class="d-flex gap-2 mb-4" role="search">
            <input type="search" name="q" class="form-control form-control-lg" th:value="${query}"
                placeholder="Search for a game" aria-label="Search games" required th:autofocus="${#strings.isEmpty(query)}">
            <button type="submit" class="btn btn-primary px-4">Search</button>
        </form>

        <p class="text-muted" th:if="${#strings.isEmpty(query)}">Search by title to find a game to review or add to a playlist.</p>

        <th:block th:unless="${#strings.isEmpty(query)}">
            <div class="section-title">
                <h2>
                    <span th:text="${#lists.size(sortedResults)}">0</span>
                    <span th:text="${#lists.size(sortedResults) == 1} ? 'result' : 'results'">results</span>
                    for “<span th:text="${query}">query</span>”
                </h2>
            </div>
            <p class="text-muted" th:if="${#lists.isEmpty(sortedResults)}">
                No games found. Try a different name or check the spelling.
            </p>
            <div class="poster-grid">
                <div th:each="g : ${sortedResults}">
                    <a th:replace="~{fragments/components :: poster(${g})}"></a>
                    <div class="poster-caption">
                        <a class="name" th:href="@{/games/{id}(id=${g.id})}" th:text="${g.name}">Game name</a>
                        <div class="meta">
                            <span th:text="${g.releaseDate ?: 'TBA'}">2020</span>
                            <span class="stars" th:if="${g.ratingGamerboxd != null and g.ratingGamerboxd > 0}"
                                th:text="|★ ${#numbers.formatDecimal(g.ratingGamerboxd, 1, 1)}|">★ 4.2</span>
                        </div>
                    </div>
                </div>
            </div>
        </th:block>
    </main>
    <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>

</html>
