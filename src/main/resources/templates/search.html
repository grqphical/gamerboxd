<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${#strings.isEmpty(query)} ? 'Search | Gamerboxd' : ('Search: ' + ${query} + ' | Gamerboxd')">Search | Gamerboxd</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="/">Gamerboxd</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <!-- Search -->
                <form class="d-flex flex-grow-1 mx-lg-auto mt-3 mt-lg-0" style="max-width: 280px;" role="search"
                    th:action="@{/search}" method="get">
                    <input class="form-control me-2" type="search" name="q" placeholder="Search games"
                        aria-label="Search games" th:value="${query}" required>
                    <button class="btn btn-outline-primary" type="submit">Search</button>
                </form>

                <div class="ms-auto ms-lg-0 d-flex align-items-center gap-2 mt-3 mt-lg-0">
                    <a class="btn btn-outline-secondary" th:unless="${currentUser}" th:href="@{/login}">Sign In</a>
                    <a class="btn btn-primary" th:unless="${currentUser}" th:href="@{/signup}">Sign Up</a>

                    <div class="dropdown" th:if="${currentUser}">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false"
                            th:text="|Hello, ${currentUser.displayName}|">
                            Hello, username
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a class="dropdown-item" th:href="@{/users/{id}(id=${currentUser.id})}">
                                    Profile
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/users/{id}/settings(id=${currentUser.id})}">
                                    Account Settings
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item">Logout</button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container py-5" style="max-width: 700px;">
        <h1 class="mb-1">Search</h1>
        <p class="text-muted mb-4" th:if="${!#strings.isEmpty(query)}">
            <span th:text="${#lists.size(results)}">0</span>
            <span th:text="${#lists.size(results) == 1} ? 'result' : 'results'">results</span>
            for “<span th:text="${query}">query</span>”
        </p>

        <!-- No query entered -->
        <p class="text-muted" th:if="${#strings.isEmpty(query)}">Enter a game name in the search bar to get started.</p>

        <!-- Query with no matches -->
        <p class="text-muted" th:if="${!#strings.isEmpty(query) and #lists.isEmpty(results)}">
            No games found. Try a different name or check the spelling.
        </p>

        <!-- Results -->
        <a class="card shadow-sm mb-3 text-decoration-none text-reset" th:each="g : ${results}"
            th:href="@{/games/{id}(id=${g.id})}">
            <div class="row g-0">
                <div class="col-3 col-sm-2">
                    <img class="img-fluid rounded-start w-100 h-100 object-fit-cover" th:if="${g.coverLink != null}"
                        th:src="${g.coverLink}" th:alt="'Cover of ' + ${g.name}">
                    <div class="bg-body-secondary h-100 d-flex align-items-center justify-content-center text-muted small rounded-start"
                        style="min-height: 120px;" th:unless="${g.coverLink != null}">No cover</div>
                </div>
                <div class="col-9 col-sm-10">
                    <div class="card-body">
                        <h5 class="card-title mb-1" th:text="${g.name}">Game name</h5>
                        <p class="text-muted small mb-2">
                            <span th:text="${g.releaseDate != null} ? ${g.releaseDate} : 'Release date unknown'">2020-01-01</span>
                            <span th:if="${g.ratingGamerboxd != null}">
                                · Gamerboxd <span
                                    th:text="${#numbers.formatDecimal(g.ratingGamerboxd, 1, 1)}">4.2</span>
                            </span>
                            <span th:if="${g.ratingIGDB != null}">
                                · IGDB <span th:text="${#numbers.formatDecimal(g.ratingIGDB, 1, 0)}">85</span>
                            </span>
                        </p>
                        <div th:if="${!#lists.isEmpty(g.genres)}">
                            <span class="badge text-bg-primary me-1" th:each="genre : ${g.genres}"
                                th:text="${genre}">Genre</span>
                        </div>
                    </div>
                </div>
            </div>
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
